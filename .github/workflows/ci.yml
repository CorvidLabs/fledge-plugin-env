name: CI

on:
  push:
    branches: [main]
    paths:
      - bin/**
      - plugin.toml
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]
    paths:
      - bin/**
      - plugin.toml
      - .github/workflows/ci.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check syntax
        run: python -m py_compile bin/fledge-env

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check bin/fledge-env

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Smoke test - check (no example file)
        run: |
          echo '{"args":["check"],"project":{"root":"'"$(pwd)"'"}}' \
            | python bin/fledge-env

      - name: Smoke test - check with example file
        run: |
          printf "DATABASE_URL=\nREDIS_URL=\n" > .env.example
          echo "DATABASE_URL=postgres://localhost/db" > .env
          echo '{"args":["check"],"project":{"root":"'"$(pwd)"'"}}' \
            | python bin/fledge-env && exit 1 || [ $? -eq 1 ]

      - name: Smoke test - list
        run: |
          echo "FOO=bar" > .env
          echo '{"args":["list"],"project":{"root":"'"$(pwd)"'"}}' \
            | python bin/fledge-env

      - name: Smoke test - diff (in sync)
        run: |
          echo "FOO=" > .env.example
          echo "FOO=bar" > .env
          echo '{"args":["diff"],"project":{"root":"'"$(pwd)"'"}}' \
            | python bin/fledge-env

      - name: Smoke test - JSON output
        run: |
          echo "A=1" > .env.example
          echo "A=1" > .env
          output=$(echo '{"args":["check","--json"],"project":{"root":"'"$(pwd)"'"}}' \
            | python bin/fledge-env)
          echo "$output" | python -c "import sys,json; d=json.loads(json.loads(sys.stdin.read())['text']); assert d['ok']"
